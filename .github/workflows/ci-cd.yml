name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r expense-backend/requirements.txt

      - name: Validate backend import
        run: |
          python -m py_compile expense-backend/run.py
          python -m py_compile expense-backend/app/__init__.py
          python -m py_compile expense-backend/app/routes.py
          python -m py_compile expense-backend/app/models.py
          python -m py_compile expense-backend/app/config.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd expense-frontend
          npm ci

      - name: Build frontend
        run: |
          cd expense-frontend
          npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: infra
        run: terraform validate
